name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# The workflow only needs to read the repo.
permissions:
  contents: read

# A new push to the same PR/branch cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv only publishes full version tags (no floating "v10"), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # Python version comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv only publishes full version tags (no floating "v10"), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest
